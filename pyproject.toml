[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-risk-analyzer"
version = "0.1.0"
description = "Production-style NLP system for contract clause classification, semantic search, and risk triage."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Illia Sator" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "joblib>=1.3",
]

[project.optional-dependencies]
data = ["datasets>=2.18"]
transformers = ["transformers>=4.38", "torch>=2.1", "evaluate>=0.4", "accelerate>=0.27"]
retrieval = ["sentence-transformers>=2.5", "faiss-cpu>=1.7"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
